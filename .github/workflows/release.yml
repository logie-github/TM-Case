name: Release mod

# Tag convention: <mod folder name>-v<version>, e.g. tm35_metronome-v1.0.0.
# Pushing a matching tag zips that one mod's folder and publishes it as a
# GitHub Release asset -- mod source stays in normal history, packaged
# zips never do.

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve mod name and version from tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Mod folder names must not themselves contain "-v", or this split
          # is ambiguous -- see CONTRIBUTING.md.
          MOD_NAME="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if [ -z "$MOD_NAME" ] || [ ! -d "mods/$MOD_NAME" ]; then
            echo "::error::Tag '$TAG' does not resolve to a mods/<name> directory (got '$MOD_NAME')"
            exit 1
          fi
          echo "mod_name=$MOD_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package mod
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP="dist/${{ steps.tag.outputs.mod_name }}-v${{ steps.tag.outputs.version }}.zip"
          ( cd mods && zip -rq "../$ZIP" "${{ steps.tag.outputs.mod_name }}" -x "*.DS_Store" )
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES_FILE="mods/${{ steps.tag.outputs.mod_name }}/README.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "${{ steps.tag.outputs.tag }}" \
              "${{ steps.package.outputs.zip_path }}" \
              --title "${{ steps.tag.outputs.mod_name }} v${{ steps.tag.outputs.version }}" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "${{ steps.tag.outputs.tag }}" \
              "${{ steps.package.outputs.zip_path }}" \
              --title "${{ steps.tag.outputs.mod_name }} v${{ steps.tag.outputs.version }}" \
              --notes "Release of ${{ steps.tag.outputs.mod_name }} v${{ steps.tag.outputs.version }}."
          fi
